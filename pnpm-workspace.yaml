packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # core-js's postinstall only prints a funding banner; no build step needed.
  core-js: false
  # protobufjs (transitive: inngest → OTel auto-instrumentation → grpc-js) uses its
  # postinstall only to stamp version metadata; the library works without it, and those
  # OTel deps are lazily imported by inngest anyway (G.1). Denied like core-js.
  protobufjs: false
  esbuild: true
  sharp: true
# Supply-chain hardening (spec §8.5; flagged by the semgrep OWASP ruleset):
# wait a day before adopting fresh releases, keep the dep tree registry-only,
# and require explicit approval for build scripts of newly added packages.
# The semgrep p/owasp-top-ten rule wants a >=7 day floor, but we deliberately
# stay at 1 day: a 7-day floor makes pnpm's dep-status check reject
# already-locked packages published within the last week and blocks every
# local `pnpm run` script (a template must install cleanly on day one), so
# we suppress the rule here instead of adopting a floor that breaks installs.
minimumReleaseAge: 1440 # nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
blockExoticSubdeps: true
trustPolicy: no-downgrade
# Old undici-types releases still get resolved by transitive @types/node ranges and
# predate npm provenance, tripping no-downgrade. Scoped exclusion, not a policy drop.
trustPolicyExclude:
  - undici-types
  # resend 6.20.0 (current `latest`) was published by a different, legitimate Resend
  # maintainer than the provenance-attested prior release — a maintainer-rotation gap,
  # not a takeover. Scoped exclusion so the official email SDK installs; revisit if
  # resend restores provenance attestation.
  - resend
  # chokidar 4.0.2/4.0.3 dropped the provenance attestation that 4.0.0/4.0.1 carried,
  # tripping no-downgrade for every tsup >=8.4.0 (which pins chokidar ^4). Build-time
  # file watcher for the installer CLI bundle only, never a runtime dep. Added
  # 2026-08-23 to unblock tsup 8.5.1; revisit if chokidar restores provenance.
  - chokidar
minimumReleaseAgeExclude:
  - lucide-react@1.33.0
# Security overrides for high-severity advisories reaching us transitively
# through `next` (sharp libvips CVEs GHSA-f88m-g3jw-g9cj; postcss source-map
# traversal GHSA-6g55-p6wh-862q / GHSA-r28c-9q8g-f849). Drop each once next
# ships with patched ranges.
overrides:
  sharp: ">=0.35.0"
  postcss: ">=8.5.18"
