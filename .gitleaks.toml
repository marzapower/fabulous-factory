# Secret-scanning config (design spec §8.5, plan D.1 + D.9.6).
#
# Extends gitleaks' own default ruleset (https://github.com/gitleaks/gitleaks — the
# built-in `gitleaks.toml`) rather than replacing it, then layers a path allowlist for
# files that legitimately contain example/placeholder secrets: `.env.example` (every
# value is a documented placeholder, never a real one — see packages/config's registry),
# research/design docs (deliberate example keys/connection strings used to illustrate
# provider setup), and the lockfile (dependency metadata, not source we author).
#
# CI runs this exact config (`--config .gitleaks.toml`) so local and CI results agree.
[extend]
useDefault = true

[allowlist]
paths = [
  '''\.env\.example$''',
  '''^docs/.*''',
  '''^pnpm-lock\.yaml$''',
]
# Known test/CI fixture values (never real credentials). Matched against the detected
# secret itself, so the files they live in stay fully scanned for anything else — a
# config-level list is required because gitleaks scans full history and an inline
# `gitleaks:allow` comment added later cannot clear a finding in an older commit.
regexTarget = "secret"
regexes = [
  '''^sk_live_abc123$''',                          # preflight.test.ts live-key-shape fixture
  '''^a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6$''',        # env.test.ts VALID_SECRET fixture
  '''^0123456789abcdef$''',                        # env.test.ts 16-char boundary fixture
  '''^abcdef1234567890$''',                        # ci.yml full-profile INNGEST_SIGNING_KEY dummy
]
