services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:24
    volumes:
      - ..:/workspaces/fabulous-factory:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/factory
      # The db service's init script (below) creates this database on first boot so
      # integration tests (packages/db/test/integration) have a real, isolated target
      # without any manual setup step.
      TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/factory_test
      # Fixed dev-only value: BETTER_AUTH_SECRET is now required (M8), and without it
      # `pnpm dev` inside the devcontainer would throw EnvValidationError. Never used
      # outside this container.
      BETTER_AUTH_SECRET: devcontainer-dev-secret-not-for-production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: factory
    volumes:
      - factory-db-data:/var/lib/postgresql
      # Runs once, on an empty data directory, after POSTGRES_DB is created — creates the
      # second database used by TEST_DATABASE_URL so the devcontainer boots with both
      # databases ready (robust alternative to relying on tests to create it themselves).
      - ./init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  factory-db-data:
