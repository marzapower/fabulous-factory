# Pushing a `vX.Y.Z` tag publishes that version to npm — see .claude/skills/release-template
# for the full checklist this workflow is the last step of (design spec §8.4, §11 M4).
# Manual `workflow_dispatch` runs are for rehearsals: they default to `dry_run: true` and
# write nothing to the registry.
#
# Authentication is npm Trusted Publishing (OIDC): the `publish` job mints a short-lived
# identity token from GitHub, so there is no NPM_TOKEN secret to store or rotate. Both
# packages must have this repo and this workflow filename registered as their trusted
# publisher on npmjs.com — renaming this file breaks publishing.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, semver without a leading v (e.g. 1.2.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run — pass --dry-run to both npm publish commands, no registry writes"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time, and never cancel one midway: a half-published pair (the CLI on
# the registry, its alias not) is worse than a queued run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag push carries the version in its own name; a dispatch takes it from the
      # input. Read through env, never interpolated into the script body.
      - name: Resolve and validate the version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -e
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$INPUT_VERSION"
          fi

          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not well-formed semver (expected X.Y.Z, e.g. 1.2.0)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION."

      - name: Assert packages/create and packages/create-alias are both at that version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -e
          CREATE_VERSION=$(jq -r .version packages/create/package.json)
          ALIAS_VERSION=$(jq -r .version packages/create-alias/package.json)

          if [ "$CREATE_VERSION" != "$VERSION" ] || [ "$ALIAS_VERSION" != "$VERSION" ]; then
            echo "::error::packages/create is at $CREATE_VERSION and packages/create-alias is at $ALIAS_VERSION, but this run is releasing $VERSION. Bump both package.json versions, commit, and re-tag."
            exit 1
          fi
          echo "packages/create and packages/create-alias both match $VERSION."

      # Keeps the `gate` job's matrix (below) and the `publish` job's lockfile-staging loop
      # honest against `presets/*/preset.json` itself: a preset added or dropped without
      # updating both literals must fail loudly here, not silently ship half-covered.
      - name: Assert the preset matrix covers every available preset
        run: |
          set -e
          ACTUAL=$(jq -rs '[.[] | select(.status == "available") | .id] | sort | join(" ")' presets/*/preset.json)
          EXPECTED="brainstorm nothing untangle"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Available presets are '$ACTUAL' but the gate matrix and publish staging loop are hardcoded to '$EXPECTED'. Update both in this workflow to match presets/*/preset.json."
            exit 1
          fi
          echo "Available presets match the gate matrix and publish staging loop: $ACTUAL."

  # The publish gate: composes each preset, scaffolds it through the real CLI, and runs
  # the scaffold's own gates and boot check. Nothing reaches the registry unless every
  # preset in the matrix is green.
  gate:
    needs: verify
    strategy:
      matrix:
        preset: [untangle, nothing, brainstorm]
    uses: ./.github/workflows/scaffold-and-check.yml
    with:
      preset: ${{ matrix.preset }}
    permissions:
      contents: read

  publish:
    needs: [verify, gate]
    runs-on: ubuntu-latest
    # Registered as the trusted publisher's environment on npmjs.com; also where a
    # required reviewer can be configured to hold the real publish for approval.
    environment: npm-publish
    permissions:
      contents: read
      # Required for Trusted Publishing — this is what lets the job mint the OIDC token
      # npm exchanges for publish rights. Without it, `pnpm publish` has no credentials.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # The lockfiles the gate matrix just validated, one per preset, dropped in where
      # each preset's compose step reads them from (design spec §5, "Lockfile"). Captured
      # in this same run rather than committed by hand, so shipped installs reproduce
      # exactly what was tested and the published templates can never silently ship
      # without a lockfile. Three explicit steps, not a pattern/merge-multiple download:
      # every captured artifact is named `pnpm-lock.yaml` internally, so a merged
      # download would collide the three presets' files into one.
      - name: Download the lockfile captured by the gate (untangle)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: captured-lockfile-untangle
          path: ${{ runner.temp }}/captured/untangle

      - name: Download the lockfile captured by the gate (nothing)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: captured-lockfile-nothing
          path: ${{ runner.temp }}/captured/nothing

      - name: Download the lockfile captured by the gate (brainstorm)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: captured-lockfile-brainstorm
          path: ${{ runner.temp }}/captured/brainstorm

      - name: Stage the captured lockfiles for the compose step
        run: |
          set -e
          for preset in untangle nothing brainstorm; do
            cp "$RUNNER_TEMP/captured/$preset/pnpm-lock.yaml" "presets/$preset/pnpm-lock.captured.yaml"
            echo "Staged $(wc -l < "presets/$preset/pnpm-lock.captured.yaml") lines into presets/$preset/pnpm-lock.captured.yaml."
          done

      # Resolved once, into the environment, rather than interpolated into each `run:`
      # body: `${{ ... }}` inside a shell script is a code-injection shape (semgrep's
      # run-shell-injection rule blocks it), and `env:` hands the value over as inert
      # data. Empty on a tag push, where `inputs.dry_run` is unset — that's a real
      # publish.
      - name: Resolve the publish flags
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e
          if [ "$DRY_RUN" = "true" ]; then
            echo "PUBLISH_FLAGS=--dry-run" >> "$GITHUB_ENV"
            echo "Dry run: nothing will be written to the registry."
          else
            echo "PUBLISH_FLAGS=" >> "$GITHUB_ENV"
            echo "Real publish."
          fi

      # No explicit compose step here: each package's `prepack` hook recomposes
      # `templates/<preset>/` fresh at publish time, so a separate compose step would
      # just be redundant work discarded before the tarball is built.
      #
      # Order matters: create-fabulous-factory depends on fabulous-factory via
      # `workspace:*`, which pnpm rewrites to the concrete version at pack time. The alias
      # must go second so it never points at a version that isn't on the registry yet.
      # $PUBLISH_FLAGS is deliberately unquoted: it holds either `--dry-run` or nothing,
      # and quoting an empty value would pass an empty argument to pnpm.
      - name: Publish fabulous-factory
        run: pnpm --filter fabulous-factory publish --access public --no-git-checks $PUBLISH_FLAGS

      - name: Publish create-fabulous-factory
        run: pnpm --filter create-fabulous-factory publish --access public --no-git-checks $PUBLISH_FLAGS

      - name: Post-publish reminder
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          echo "::notice::Published $VERSION. Verify with: npx fabulous-factory@$VERSION install"
          echo "::notice::Keep the GitHub Template-repository checkbox OFF — the npx installer is the only supported adoption door (design spec §9; docs/guides/release-checklist.md §5)."
