name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint PR title (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm commitlint

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Real Postgres service (M2): the packages/db integration test connects to this
      # and creates the auth tables via the migrator; see packages/db/test/integration.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm gen:env-example --check

      - run: pnpm typecheck

      - run: pnpm test

  # M1 minimal-profile boot check (design spec §5.1/§9.5): the app must build and serve
  # liveness with nothing but DATABASE_URL set. M2 fulfills the promise that was
  # deferred here in M1: a real Postgres service container now backs DATABASE_URL, the
  # migrator runs against it, and the app still boots to a healthy liveness check with
  # every other capability var unset.
  minimal-boot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:migrate

      - run: pnpm build

      - name: Boot standalone server and poll /api/health
        run: |
          set -e
          PORT=3100 HOSTNAME=127.0.0.1 node apps/web/.next/standalone/apps/web/server.js &
          SERVER_PID=$!

          status=1
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:3100/api/health 2>/dev/null); then
              if echo "$body" | grep -q '"status":"ok"'; then
                echo "Health check passed: $body"
                status=0
                break
              fi
            fi
            sleep 1
          done

          kill "$SERVER_PID" 2>/dev/null || true
          exit $status
