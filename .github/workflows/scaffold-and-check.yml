# Composes the given preset, scaffolds it through the *actual installer CLI*, and runs
# the output's own gates and boot check — this validates what adopters actually receive,
# distinct from the factory's own `quality`/`minimal-boot` jobs (design spec §8.3, §9,
# §11 M4). Reusable so `ci.yml` (release triggers) and `release.yml` (the publish gate)
# run the exact same validation rather than two drifting copies, once per preset via a
# caller-side matrix.
#
# The `captured-lockfile-<preset>` artifact it uploads is what `release.yml` drops into
# presets/<preset>/pnpm-lock.captured.yaml before packing, so every shipped install
# carries the lockfile this job just validated.
name: Scaffold and check

on:
  workflow_call:
    inputs:
      preset:
        description: "Preset id to compose, scaffold, and validate (e.g. untangle, nothing, brainstorm)"
        required: true
        type: string

jobs:
  scaffold-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Job-level, mirroring minimal-boot above: the scaffold's own `pnpm build` reads
      # this at module scope during page-data collection, before any boot step.
      BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-do-not-use-in-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compose the preset template (packages/create/templates/<preset>)
        env:
          PRESET: ${{ inputs.preset }}
        run: pnpm compose --preset "$PRESET"

      - name: Scaffold the preset through the installer CLI
        env:
          PRESET: ${{ inputs.preset }}
        run: pnpm exec tsx packages/create/src/cli.ts install --yes --no-install --no-git --dir "$RUNNER_TEMP/scaffold" --preset "$PRESET"

      # From here on, everything runs inside the scaffold — a standalone pnpm workspace
      # with no relation to the factory's own lockfile or node_modules.
      - name: Install the scaffold's dependencies (first resolution, not frozen)
        working-directory: ${{ runner.temp }}/scaffold
        run: pnpm install

      - name: Run the scaffold's own gates
        working-directory: ${{ runner.temp }}/scaffold
        run: pnpm check

      - name: Migrate the scaffold's database
        working-directory: ${{ runner.temp }}/scaffold
        run: pnpm db:migrate

      - name: Build the scaffold
        working-directory: ${{ runner.temp }}/scaffold
        run: pnpm build

      - name: Boot the scaffold's standalone server and poll /api/health
        working-directory: ${{ runner.temp }}/scaffold
        run: |
          set -e
          PORT=3100 HOSTNAME=127.0.0.1 node apps/web/.next/standalone/apps/web/server.js &
          SERVER_PID=$!

          status=1
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:3100/api/health 2>/dev/null); then
              if echo "$body" | grep -q '"status":"ok"'; then
                echo "Health check passed: $body"
                status=0
                break
              fi
            fi
            sleep 1
          done

          kill "$SERVER_PID" 2>/dev/null || true
          exit $status

      # Captured here, not regenerated at publish time (design spec §5, "Lockfile"): a
      # later release step commits this into presets/<preset>/pnpm-lock.captured.yaml so
      # the shipped install is exactly what this job just validated, not a fresh resolution.
      - name: Upload the captured lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: captured-lockfile-${{ inputs.preset }}
          path: ${{ runner.temp }}/scaffold/pnpm-lock.yaml
